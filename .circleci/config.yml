# J3Y17LTE XNU (iOS 16-era XNU 8796) build on CircleCI macOS.
# This does not flash any Samsung partitions or download iOS firmware.
# Keep in sync with .github/workflows/xnu.yml when changing the build.
version: 2.1

jobs:
  j3-xnu:
    macos:
      # CircleCI's supported Xcode 16 image (GitHub's last green used 16.0).
      # The Apple Silicon host and Xcode 16.4 need their own validation.
      xcode: "16.4.0"
    resource_class: m4pro.medium
    environment:
      DXB_REPO: https://github.com/blacktop/darwin-xnu-build
      DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
      MACOS_VERSION: "13.5"
      KERNEL_CONFIG: DEVELOPMENT
      MACHINE_CONFIG: J3Y17LTE
    steps:
      - checkout

      - run:
          name: Prepare pinned XNU build and patches
          command: |
            set -euo pipefail
            git init -q dxb
            git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
            git -C dxb checkout -q FETCH_HEAD
            cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/

            # The Samsung target is plain ARM64, not just ARM64e.
            sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
            grep -Fq 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

      - run:
          name: Install dependencies and inspect Xcode
          command: |
            set -euo pipefail
            brew install jq gum bash cmake ninja ccache

            # dxb/build.sh checks for xcodes, but its installer is unused
            # because CircleCI already supplies Xcode. Put a no-op executable
            # in PATH for that existence check only.
            mkdir -p "$HOME/.local/bin"
            printf '#!/bin/sh\nexit 0\n' > "$HOME/.local/bin/xcodes"
            chmod +x "$HOME/.local/bin/xcodes"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/.local/bin:$PATH"

            sw_vers
            uname -m
            xcodebuild -version
            xcrun --find clang
            xcrun --find iig
            xcode-select -p

      - run:
          name: Strict J3 patch preflight
          command: |
            set -euo pipefail
            git clone --depth 1 --branch rel/xnu-8796 \
              https://github.com/apple-oss-distributions/xnu.git \
              preflight-xnu
            cd preflight-xnu
            echo "===== STAGING ====="
            for script in ../xnu/patches/*.sh; do
              echo "RUN: $(basename "$script")"
              bash "$script"
            done
            echo "===== PATCHES ====="
            for patch in ../xnu/patches/*.patch; do
              echo "APPLY: $(basename "$patch")"
              git apply --check "$patch"
              git apply "$patch"
            done
            # Never invoke a pager or wait for input in CI.
            if ! GIT_PAGER=cat git --no-pager diff --check >/dev/null 2>&1; then
              echo "WARNING: donor-derived whitespace issues (non-blocking)"
            fi

            echo "===== BOARD AND BOOT MARKERS ====="
            grep -n 'MACHINE_FLAGS_ARM64_J3Y17LTE' makedefs/MakeInc.def
            grep -nE \
              'MAX_CPUS|SWEET_SMP_MAX_CPUS|VTIMER_INTID|PAN_AVAILABLE|CRYPTO_EXTENSIONS|HAS_GIC_V3' \
              pexpert/pexpert/arm64/J3Y17LTE.h \
              pexpert/pexpert/arm64/board_config.h
            grep -n 'sweet_early_mark(101, "J3XNU019 telemetry bypass")' osfmk/kern/startup.c
            grep -n 'sweet_early_mark(110, "J3XNU019 PMAP activate done")' osfmk/kern/startup.c
            grep -n 'J3 bring-up: once ktrace finishes' osfmk/kern/startup.c
            grep -n 'stage > 120' osfmk/arm64/sweet_early.c
            grep -n 'sweet_early_mark(111, "J3XNU021 entered sched_init")' osfmk/kern/sched_prim.c
            grep -n 'sweet_early_mark(120, "J3XNU021 deadline tracking initialized")' osfmk/kern/sched_prim.c

      - run:
          name: Compile J3 XNU kernel
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            cd dxb
            export CCACHE=ccache
            export MAKEFLAGS=-k
            bash build.sh

      - run:
          name: Verify and package ARM64 kernel
          command: |
            set -euo pipefail
            mkdir -p out
            cp -R dxb/fakeroot/System/Library/Kernels/. out/
            test -s out/kernel.development.j3y17lte
            file out/kernel.development.j3y17lte
            file out/kernel.development.j3y17lte | grep -Eq 'Mach-O 64-bit.*arm64'
            (
              cd out
              shasum -a 256 kernel.development.j3y17lte > SHA256SUMS
              shasum -a 256 -c SHA256SUMS
              cat SHA256SUMS
            )
            tar -czf j3y17lte-xnu-kernel.tgz -C out kernel.development.j3y17lte SHA256SUMS
            tar -tzf j3y17lte-xnu-kernel.tgz
            shasum -a 256 j3y17lte-xnu-kernel.tgz

      # Retain the raw kernel even if a later packaging step fails.
      - store_artifacts:
          path: out/kernel.development.j3y17lte
          destination: kernel.development.j3y17lte

      - store_artifacts:
          path: j3y17lte-xnu-kernel.tgz
          destination: j3y17lte-xnu-kernel.tgz

      - store_artifacts:
          path: out/SHA256SUMS
          destination: SHA256SUMS

workflows:
  j3-xnu-build:
    jobs:
      - j3-xnu:
          filters:
            branches:
              only: main
