name: xnu-j3y17lte

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: J3Y17LTE
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, codex/a5xelte-bringup]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'J3Y17LTE' }}

jobs:
  build:
    # macOS 14 GitHub runners were retired on 2026-11-02.
    # Keep the host x86_64 with macos-15-intel and pin the oldest
    # available Xcode (16.0) so the toolchain change is controlled.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          echo "Host architecture: $(uname -m)"
          echo "Available Xcodes:"
          ls -d /Applications/Xcode*.app

          XC=/Applications/Xcode_16.app
          if [ ! -d "$XC" ]; then
            echo "ERROR: Xcode 16.0 is not installed on this runner"
            exit 1
          fi

          echo "Using $XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"

          xcodebuild -version
          clang --version
          xcrun --find iig

      - name: Strict J3 patch preflight
        run: |
          set -euo pipefail

          git clone --depth 1 --branch rel/xnu-8796 \
            https://github.com/apple-oss-distributions/xnu.git \
            preflight-xnu

          cd preflight-xnu

          export MACHINE_CONFIG=J3Y17LTE
          export MACOS_VERSION=13.5

          echo "===== STAGING ====="
          for script in ../xnu/patches/*.sh; do
            echo "RUN: $(basename "$script")"
            bash "$script"
          done

          echo "===== PATCHES ====="
          for patch in ../xnu/patches/*.patch; do
            echo "APPLY: $(basename "$patch")"
            git apply --check "$patch"
            git apply "$patch"
          done

          echo "===== WHITESPACE ====="
          git diff --check || echo "::warning::Whitespace issues found in donor-derived tree; continuing"

          echo "===== J3 CODEGEN ====="
          grep -n 'MACHINE_FLAGS_ARM64_J3Y17LTE' \
            makedefs/MakeInc.def

          echo "===== J3 BOARD ====="
          grep -nE \
            'MAX_CPUS|SWEET_SMP_MAX_CPUS|VTIMER_INTID|PAN_AVAILABLE|CRYPTO_EXTENSIONS|HAS_GIC_V3' \
            pexpert/pexpert/arm64/J3Y17LTE.h \
            pexpert/pexpert/arm64/board_config.h

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: xnu-ccache-macos15-intel-xcode16-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-${{ github.sha }}
          restore-keys: |
            xnu-ccache-macos15-intel-xcode16-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-

      - name: Configure compiler cache
        run: |
          mkdir -p ~/.ccache
          ccache --set-config=cache_dir=${HOME}/.ccache
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --zero-stats
          ccache --show-config

      - name: Build
        working-directory: dxb
        env:
          # XNU 8796 natively supports make CCACHE=ccache; this leaves the
          # compiler, flags, generated sources and validation unchanged while
          # reusing identical compile results across clean GitHub runners.
          CCACHE: ccache
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Compiler cache stats
        if: always()
        run: ccache --show-stats

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
